<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Windows Bridge Speech</title>
<link rel="stylesheet" href="caption.css">
<script src="caption-renderer.js" defer></script>
</head>
<body>
<main id="caption-card" class="caption-card" data-theme="midnight" aria-live="polite">
<header class="caption-header"><span class="caption-label">WINDOWS BRIDGE · SPEECH</span><button id="caption-dismiss" class="caption-dismiss" type="button" aria-label="Dismiss speech notification">×</button></header>
<p id="caption-text" class="caption-text"></p>
<p id="caption-status" class="caption-status">Preparing speech…</p>
<p id="caption-error" class="caption-error" hidden></p>
<footer class="caption-actions"><button id="caption-play" class="caption-play" type="button" hidden>▶ Play</button></footer>
</main>
</body>
</html>
