<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Windows Repository Bridge</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="status-window" aria-label="Windows Repository Bridge status">
    <button id="minimize" class="window-control minimize-control" type="button" title="Minimize to system tray" aria-label="Minimize to system tray">−</button>
    <button id="quit" class="window-control quit-control" type="button" title="Quit application" aria-label="Quit application">×</button>

    <button id="github-row" class="status-row" type="button" aria-label="GitHub connection status">
      <span id="github-dot" class="status-dot waiting" aria-hidden="true"></span>
      <span id="github-status" class="status-label">GitHub checking…</span>
    </button>

    <div class="status-row worker-row" role="status" aria-live="polite">
      <span id="worker-dot" class="status-dot waiting" aria-hidden="true"></span>
      <span id="worker-status" class="status-label">Worker connecting…</span>
    </div>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
