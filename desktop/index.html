<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Windows Repository Bridge</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="status-window" aria-label="Windows Repository Bridge status">
    <button id="minimize" class="window-control minimize-control" type="button" title="Minimize to system tray" aria-label="Minimize to system tray">−</button>
    <button id="quit" class="window-control quit-control" type="button" title="Quit application" aria-label="Quit application">×</button>

    <div id="github-row" class="status-row github-status-row" role="group" aria-label="GitHub connection status">
      <span id="github-dot" class="status-dot waiting" aria-hidden="true"></span>
      <span id="github-status" class="status-label">GitHub checking…</span>
      <button id="github-signin" class="status-action" type="button" aria-label="Sign in to GitHub">Sign in to GitHub</button>
    </div>

    <div class="status-row worker-row" role="status" aria-live="polite">
      <span id="worker-dot" class="status-dot waiting" aria-hidden="true"></span>
      <span id="worker-status" class="status-label">Worker connecting…</span>
    </div>

    <button id="workspace-row" class="status-row" type="button" aria-label="Choose workspace folder" title="Click to choose the folder whose file names are indexed">
      <span id="workspace-dot" class="status-dot waiting" aria-hidden="true"></span>
      <span id="workspace-status" class="status-label">Workspace: checking…</span>
    </button>

    <button id="auto-accept-row" class="status-row" type="button" aria-label="Toggle automatic approval" aria-pressed="false" title="Click to enable automatic approval for all local operations. Enabling requires confirmation.">
      <span id="auto-accept-dot" class="status-dot waiting" aria-hidden="true"></span>
      <span id="auto-accept-status" class="status-label">Auto-accept everything: OFF</span>
    </button>

    <div id="vision-row" class="status-row vision-row" role="group" aria-label="Colab vision controls">
      <span id="vision-dot" class="status-dot waiting" aria-hidden="true"></span>
      <span id="vision-status" class="status-label" title="Live Colab vision status">Vision: checking…</span>
      <button id="vision-signin" class="status-action vision-action" type="button" aria-label="Open Google Colab sign-in">Sign in</button>
      <button id="vision-setup-check" class="status-action vision-action" type="button" aria-label="Check vision setup">Setup check</button>
    </div>

    <section id="vision-details" class="vision-details" aria-label="Vision setup details" aria-live="polite">
      <div class="vision-detail"><span class="vision-detail-label">Setup</span><span id="vision-setup-detail" class="vision-detail-value">Not checked</span></div>
      <div class="vision-detail"><span class="vision-detail-label">Mailbox</span><span id="vision-mailbox-detail" class="vision-detail-value">Not checked</span></div>
      <div class="vision-detail"><span class="vision-detail-label">Colab</span><span id="vision-colab-detail" class="vision-detail-value">No heartbeat yet</span></div>
      <div class="vision-detail"><span class="vision-detail-label">Model</span><span id="vision-model-detail" class="vision-detail-value">Not verified</span></div>
    </section>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
