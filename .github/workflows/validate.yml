name: Desktop app validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: npm run check
      - name: Test overlay geometry
        run: npm test
      - name: Validate package metadata
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.main -ne 'desktop/main.js') { throw 'package.json main must point to desktop/main.js' }
          if (Test-Path 'extension/manifest.json') { throw 'Obsolete browser extension manifest remains in the desktop-only repository.' }
      - name: Build unpacked Windows application
        run: npm run dist:win:dir
